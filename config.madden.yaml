# Madden 27 side run: captions for play-formation-engine (PFE).
#
# Used by the `youtube-madden` Nomad job in schellout, which scrapes into its
# own output dir (~/data/youtube-madden, so its seen.json never races the main
# scraper's) and then runs `cli.js push` to send each video's raw SRT to PFE.
#
# This run makes no LLM calls and feeds nothing else:
#   force_category  skips classification (no Ollama/Claude call per video)
#   summarize       false skips the per-video summary (no LLM call)
#   news_export     false keeps it out of NEWS_MD_DIR even if that is set
#   r2_sync         false: `rclone sync` would mirror this dir onto the main
#                   r2:scraper-data/youtube prefix and delete the real data
#   keep_srt        writes <id>-<slug>.srt + _video-<id>.json for `push`

output_dir: ./output-madden
since_hours: 72
limit: 3
model: ollama
force_category: madden
summarize: false
news_export: false
r2_sync: false
keep_srt: true

