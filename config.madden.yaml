videos:

# --- Team-specific counters (searches) --------------------------------------
# Each run takes search_teams_per_run teams from the list below, advancing by
# UTC day, and runs every template for each: 2 templates x 5 teams = 10
# searches a day, all 32 teams covered every 7 days. Each search is one
# flat listing; captions are fetched only for results not already in seen.json.
search_results: 3
search_teams_per_run: 5

search_templates:
  - Madden 27 how to stop the {team} offense
  - Madden 27 how to beat the {team}

search_teams:
