name: CI

# Inline rather than calling schellout's reusable ci-node.yml: this repo is
# public and schellout is private, and GitHub does not let a public repo call a
# private repo's workflows (every run since 2026-10-08 failed before starting).
#
# Always GitHub-hosted. A public repo's pull requests can come from forks, and
# fork code must never run on the homelab runners.

on:
  pull_request:
  push: { branches: [main] }

permissions: { contents: read }

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"     # the mini runs 26; `node --test test/` needs 22.x+ directory support, which 22 lacks
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run test --if-present
      - run: npm run build --if-present
