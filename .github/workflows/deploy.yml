name: Deploy

# Ships main to the mac-mini runtime (~/youtube-scraper, which the Nomad jobs
# youtube-scraper and youtube-madden run from). Inline rather than calling
# schellout's reusable deploy-mini.yml, which a public repo cannot call.
#
# Runs ON the mini's self-hosted runner, so it triggers on push to main only,
# never on pull_request: fork code must not reach the homelab.
#
# No `rsync --delete`: the runtime also holds what runs leave behind (.yt-tmp,
# output when run without --output), and a delete would remove anything there
# that is not in the repo. config.yaml ships like any other file.
# The periodic batch jobs (youtube-scraper, youtube-madden) read the code on
# their next run. The youtube-api-mini service runs api/ from this path and is
# restarted below so an api/ change takes effect.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-youtube-scraper
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ${{ vars.CI_RUNNER_MAC || 'macos-14' }}
    env:
      RUNTIME_PATH: /Users/joshschell/youtube-scraper
    steps:
      - name: Require the homelab runner
        if: runner.environment == 'github-hosted'
        run: |
          echo "::error::Deploys run on the mac-mini (CI_RUNNER_MAC); this landed on a GitHub-hosted runner."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"     # the mini runs 26; `node --test test/` (a directory) fails on Node 22
          cache: npm
      - name: Test before shipping
        run: |
          npm ci
          npm run test --if-present
      - name: Sync into the runtime path
        run: |
          set -euo pipefail
          mkdir -p "$RUNTIME_PATH"
          rsync -a \
            --exclude '.git' --exclude '.github' --exclude 'node_modules' \
            ./ "$RUNTIME_PATH/"
          cd "$RUNTIME_PATH"
          npm ci --omit=dev
      - name: Restart the API service
        run: |
          set -euo pipefail
          if [ -f "$HOME/.agentsecrets" ]; then . "$HOME/.agentsecrets"; fi
          export NOMAD_ADDR="${NOMAD_ADDR:-http://10.0.0.2:4646}"
          nomad job restart -on-error=fail youtube-api-mini
